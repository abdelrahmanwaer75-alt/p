name: Vidora CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

concurrency:
  group: vidora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff mypy pip-audit
      - run: python -m compileall -q app tests worker.py
      - run: PYTHONPATH=. pytest -q
      - run: ruff check .
      - run: mypy .
      - name: Audit declared Python dependencies
        run: pip-audit -r requirements.txt --strict

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vidora
          POSTGRES_PASSWORD: vidora-ci-password
          POSTGRES_DB: vidora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidora -d vidora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Apply Alembic migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://vidora:vidora-ci-password@127.0.0.1:5432/vidora
          ENVIRONMENT: ci
          AUTO_CREATE_DB: 'false'
          JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
          ALLOWED_ORIGINS: https://ci.example.test
        run: alembic upgrade head
      - name: Run real PostgreSQL and Redis integration tests
        env:
          VIDORA_CI_DATABASE_URL: postgresql+psycopg://vidora:vidora-ci-password@127.0.0.1:5432/vidora
          VIDORA_CI_REDIS_URL: redis://127.0.0.1:6379/0
          DATABASE_URL: postgresql+psycopg://vidora:vidora-ci-password@127.0.0.1:5432/vidora
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: ci
          AUTO_CREATE_DB: 'false'
          JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
          ALLOWED_ORIGINS: https://ci.example.test
        run: PYTHONPATH=. pytest -q tests/integration tests/repositories

  flutter:
    name: Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Freezed and json_serializable generation
        run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_USER: vidora
          POSTGRES_PASSWORD: ci-compose-password
          POSTGRES_DB: vidora
          JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
        run: docker compose -f infrastructure/docker-compose.yml config
      - name: Build backend image
        run: docker build -f backend/Dockerfile backend

  security:
    name: Repository security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'

  yaml:
    name: Workflow YAML validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyyaml
      - name: Parse GitHub Actions workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_dir = Path('.github/workflows')
          workflow_files = sorted(workflow_dir.glob('*.y*ml'))
          if not workflow_files:
              raise SystemExit('No workflow YAML files found')
          for path in workflow_files:
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'Validated {path}')
          PY
