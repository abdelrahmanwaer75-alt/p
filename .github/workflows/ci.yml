name: Vidora CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff mypy
      - run: PYTHONPATH=. pytest -q
      - run: python -m compileall -q app tests worker.py
      - run: ruff check app tests worker.py
      - run: mypy app --ignore-missing-imports

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vidora
          POSTGRES_PASSWORD: vidora-ci-password
          POSTGRES_DB: vidora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidora -d vidora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - name: Apply Alembic migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://vidora:vidora-ci-password@127.0.0.1:5432/vidora
          ENVIRONMENT: production
          AUTO_CREATE_DB: 'false'
          JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
          ALLOWED_ORIGINS: https://ci.example.test
        run: alembic upgrade head

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Run code generation when configured
        shell: bash
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner dependency is configured; generated sources are committed."
          fi
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_USER: vidora
          POSTGRES_PASSWORD: ci-compose-password
          POSTGRES_DB: vidora
          JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
        run: docker compose -f infrastructure/docker-compose.yml config
      - name: Build backend image
        run: docker build -f backend/Dockerfile backend
