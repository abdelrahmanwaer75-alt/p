services:
  api:
    build:
      context: ../backend
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://vidora:vidora@postgres:5432/vidora
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-development-secret-32
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../backend
    command: python worker.py
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DOWNLOAD_DB_PATH: /app/data/vidora_downloads.db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-development-secret-32
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vidora
      POSTGRES_PASSWORD: vidora
      POSTGRES_DB: vidora
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
